# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "291866437db7b9cb4c4ab21adb8248c7"
name = "tasslelife cart"
application_url = "https://tasslelife-cart-mmcz.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products,write_products,write_metaobject_definitions,write_metaobjects"

[auth]
redirect_urls = [
  "https://tasslelife-cart-mmcz.onrender.com/auth/callback",
  "https://tasslelife-cart-mmcz.onrender.com/auth/shopify/callback",
  "https://tasslelife-cart-mmcz.onrender.com/api/auth/callback"
]

# Cart drawer settings stored on the shop
[shop.metafields.cart_drawer.settings]
type = "json"
name = "Cart Drawer Settings"
description = "Stores cart drawer appearance and behavior settings"

  [shop.metafields.cart_drawer.settings.access]
  admin = "merchant_read_write"

# Cart drawer upsell product IDs
[shop.metafields.cart_drawer.upsell_products]
type = "json"
name = "Cart Drawer Upsell Products"
description = "Stores product IDs selected as upsell recommendations in the cart drawer"

  [shop.metafields.cart_drawer.upsell_products.access]
  admin = "merchant_read_write"
