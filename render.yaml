databases:
  - name: tasslelife-db
    plan: free
    databaseName: tasslelife_db
    user: tasslelife_user

services:

  - type: web
    name: tasslelife-cart
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SHOPIFY_APP_URL
        value: https://tasslelife-cart.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tasslelife-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,write_products,write_metaobject_definitions,write_metaobjects
      - key: HOST
        fromService:
          name: tasslelife-cart
          type: web
          property: host
